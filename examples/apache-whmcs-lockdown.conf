# Include inside the <VirtualHost *:443> for example.com (e.g. via
#   Include /etc/apache2/whmcs-lockdown.conf). Lives outside the WHMCS docroot,
# so WHMCS upgrades never overwrite it. Requires mod_rewrite and mod_remoteip.
# Everything blocked returns a real 404 (not 403).

UseCanonicalName On

# Real client IPs behind Tailscale Serve: trust X-Forwarded-For only from this server.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 192.0.2.10        # this server's public IP (example)

RewriteEngine On

# Admin area: tailnet, allowlisted IP, or the tailnet Host arriving via Serve on this box.
RewriteCond expr "! ( -R '100.64.0.0/10' || %{REMOTE_ADDR} == '203.0.113.10' || ( ( %{REMOTE_ADDR} == '127.0.0.1' || %{REMOTE_ADDR} == '192.0.2.10' ) && %{HTTP_HOST} =~ /^whmcs\.example\.ts\.net(:443|:8443)?$/i ) )"
RewriteRule ^/admin(/|$) - [R=404,L]

# API: tailnet, loopback/self, and allowlisted IP(s) only.
RewriteCond expr "! ( -R '100.64.0.0/10' || -R '127.0.0.1/32' || %{REMOTE_ADDR} == '192.0.2.10' || %{REMOTE_ADDR} == '203.0.113.10' )"
RewriteRule ^/includes/api\.php$ - [R=404,L]

# Never web-reachable.
RewriteRule ^/(vendor|whmcsupdates)(/|$) - [R=404,L]

# Nginx equivalent (sketch):
# location ^~ /admin/ { allow 100.64.0.0/10; allow 127.0.0.1; allow 203.0.113.10; deny all; error_page 403 =404 /404; ... }
# location = /includes/api.php { allow 100.64.0.0/10; allow 127.0.0.1; allow 203.0.113.10; deny all; error_page 403 =404 /404; ... }
# location ^~ /vendor/ { return 404; }  location ^~ /whmcsupdates/ { return 404; }
