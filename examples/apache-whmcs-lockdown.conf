# Include inside the <VirtualHost *:443> for example.com (e.g. via
#   Include /etc/apache2/whmcs-lockdown.conf). Lives outside the WHMCS docroot,
# so WHMCS upgrades never overwrite it. Requires mod_rewrite and mod_remoteip.
# Everything blocked returns a real 404 (not 403).
#
# Live chain (README section 11.1): tailscale serve --https=8443 proxies to
# nginx on 127.0.0.1:8088, which forces Host: example.com and forwards to
# https://127.0.0.1:443. Tailnet clients therefore show up as 100.64.0.0/10.
# Do not match a .ts.net Host header here; nginx never forwards that name.
# /status is intentionally public and has no rule below.

UseCanonicalName On

# Real client IPs behind Tailscale Serve and the nginx Host-rewrite proxy.
# Trust X-Forwarded-For only from this server. 127.0.0.1 is required: nginx
# listens on loopback, and without it every tailnet client appears as
# 127.0.0.1. A WHMCS login ban on that address then locks every admin out.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 192.0.2.10 127.0.0.1

RewriteEngine On

# /sysadmin: tailnet range or an allowlisted IP. Access rests on
# 100.64.0.0/10 (mod_remoteip sets REMOTE_ADDR from X-Forwarded-For).
RewriteCond expr "! ( -R '100.64.0.0/10' || %{REMOTE_ADDR} == '203.0.113.10' )"
RewriteRule ^/sysadmin(/|$) - [R=404,L]

# API: tailnet clients bypass. Everyone else is limited to loopback, this
# server, and the allowlisted IP. Public callers get 404.
RewriteCond expr "! -R '100.64.0.0/10'"
RewriteCond expr "! ( -R '100.64.0.0/10' || -R '127.0.0.1/32' || %{REMOTE_ADDR} == '192.0.2.10' || %{REMOTE_ADDR} == '203.0.113.10' )"
RewriteRule ^/includes/api\.php$ - [R=404,L]

# /vendor and /whmcsupdates: tailnet bypass, 404 for everyone else.
RewriteCond expr "! -R '100.64.0.0/10'"
RewriteRule ^/(vendor|whmcsupdates)(/|$) - [R=404,L]

# If you terminate TLS on nginx itself instead of examples/nginx-tailnet-hostfix.conf:
# location ^~ /sysadmin/ { allow 100.64.0.0/10; allow 203.0.113.10; deny all; error_page 403 =404 /404; }
# location = /includes/api.php { allow 100.64.0.0/10; allow 127.0.0.1; allow 203.0.113.10; deny all; error_page 403 =404 /404; }
# location ^~ /vendor/ { allow 100.64.0.0/10; deny all; error_page 403 =404 /404; }
# location ^~ /whmcsupdates/ { allow 100.64.0.0/10; deny all; error_page 403 =404 /404; }
