# /etc/nginx/conf.d/admin-subdomain-tailnet.conf  (2026-11-04)
# admin.example.com = tailnet-only WHMCS admin. TivroAdminPasskeys rpId is admin.example.com, so the browser origin has to be this name.
# DNS: Cloudflare A admin.example.com -> 100.x.y.z (DNS-only). Listens ONLY on the tailnet IP.
# Upstream sees Host example.com (WHMCS license binding unchanged); browser origin stays admin.example.com.
server {
    listen 100.x.y.z:443 ssl http2;
    server_name admin.example.com;
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    allow 100.64.0.0/10;
    deny all;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    location = / { return 302 /sysadmin/; }
    location / {
        proxy_pass https://ORIGIN_PUBLIC_IP:443;
        proxy_ssl_server_name on;
        proxy_ssl_name example.com;
        proxy_ssl_verify off;
        proxy_set_header Host example.com;
        proxy_set_header X-Forwarded-Host example.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect https://example.com/ https://admin.example.com/;
        proxy_redirect http://example.com/ https://admin.example.com/;
        proxy_redirect https://www.example.com/ https://admin.example.com/;
        proxy_cookie_domain example.com admin.example.com;
        proxy_cookie_domain .example.com admin.example.com;
    }
}
