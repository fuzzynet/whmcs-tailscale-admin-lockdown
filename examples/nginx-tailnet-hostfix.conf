# Install as /etc/nginx/conf.d/nginx-tailnet-hostfix.conf
# and remove /etc/nginx/sites-enabled/default.
# tailscale serve (:8443 tailnet) -> nginx 127.0.0.1:8088 -> Apache https 127.0.0.1:443 with Host example.com
# See README section 11.1. Placeholder names only; no real hostnames or secrets.

server {
    listen 127.0.0.1:8088;
    server_name _;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    location / {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name example.com;
        proxy_ssl_verify off;
        proxy_set_header Host example.com;
        proxy_set_header X-Forwarded-Host example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect https://example.com/ /;
        proxy_redirect http://example.com/ /;
    }
}
